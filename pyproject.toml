[tool.poetry]
name = "dotfiles-linux-dev"
version = "0.0.0"
description = "Bash-based Linux dotfiles and system-setup toolkit"
authors = ["guilhermegor"]
# Bash repo: Poetry only pins the docs toolchain, it never builds a package.
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6"
mkdocs-material = "^9.5"
mike = "^2.1"
pymdown-extensions = "^10.0"
commitizen = "^4.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
