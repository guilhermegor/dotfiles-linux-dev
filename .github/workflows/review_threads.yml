name: review_threads

# The review gate: a finding needs BOTH a REPLY (why it changed) and then a
# RESOLVE — resolving alone records the bot's satisfaction, never the
# reasoning, and the reasoning is what the next session reads.
#
# ⚠️ Triggers on pull_request_review / pull_request_review_comment, NEVER on
# pull_request: a verdict computed at push time goes stale the instant a
# review lands (blueprintx#180 merged with two threads open, all green).
# ⚠️ Also fails when NO reviewer has reported at all, not only when a thread
# is left open (blueprintx#213 merged unreviewed with every check green).
#
# ⚠️ dotfiles-dev#431: a CLEAN review fires neither of the two triggers above
# — CodeRabbit posts NO pull_request_review and NO review comment when it
# finds nothing (measured on #412: `pulls/412/reviews` length 0, mergeStateStatus
# BLOCKED forever). It DOES always post a plain PR comment either way: "Full
# review finished" on success, a rate-limit refusal otherwise (review_retry.yml
# already reacts to that second shape). `issue_comment` is the missing signal,
# added third here.
#
# ⚠️ The step below NEVER short-circuits to success just because an
# issue_comment fired it — a GitHub Actions job that exits 0 posts a real
# green check-run, so bailing early on "not CodeRabbit's marker" would let a
# rate-limit refusal (or any human comment) silently satisfy the required
# check before any review happened, reopening blueprintx#213 through a side
# door. Every trigger — including issue_comment — instead falls through to
# the SAME live re-check of reviews/threads; the completion marker only ever
# ADDS a positive "a reviewer has reported" signal, it never skips the check.
#
# ⚠️ dotfiles-dev#492: a push moves the PR head and NONE of the three
# triggers above observe that — the required check stays stranded on the old
# commit and the new head carries no check-run at all, which branch
# protection reads as BLOCKED exactly like a red one, with nothing to
# explain why. The fix for THAT is deliberately not `pull_request:
# [synchronize]` on this file: adding it here would recompute this script's
# full live verdict at push time, and the honest verdict at push time is
# almost always "no reviewer has reported on this head yet" mixed with
# whatever review state carried over from the OLD head — reopening
# blueprintx#180 in the opposite direction (a stale pass surviving the push
# that invalidated it). The push-triggered half lives in the sibling
# workflow `review_threads_republish.yml`, which only ever publishes
# `failure` (or the non-review "not required" scope skip) on a push, never a
# review-based `success`. `workflow_dispatch` below is the manual escape
# hatch instead: it re-runs this file's own live verdict computation
# on-demand, the same computation a review/comment event would trigger,
# so it can still legitimately publish `success`.
on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to recompute and republish the live verdict for
        required: true

permissions:
  contents: read
  pull-requests: read
  # checks: write is what lets this job publish its verdict onto the PR head —
  # see the report() helper below for why that has to be explicit.
  checks: write

jobs:
  gate:
    name: Review threads answered
    runs-on: ubuntu-latest
    # issue_comment fires for both issues and PRs; skip a plain-issue comment
    # outright rather than let PR_NUMBER resolve to a non-PR issue number.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    steps:
      # ⚠️ Pin to the DEFAULT BRANCH, never the event's ref. For
      # pull_request_review and pull_request_review_comment GITHUB_REF is the
      # PR merge ref, so a bare checkout hands PR-controlled code to the
      # `source` below — which now runs with checks: write. That code could
      # publish a passing required check without ever calling
      # gate_pr_thread_state. The token is the reason this pin is mandatory:
      # before it there was nothing to steal.
      # Trade-off, accepted: a PR that edits review_thread_gate.sh is judged
      # by master's copy, not its own. That is correct for a required check —
      # and it also removes the "PR behind base is judged by the old gate"
      # problem, since every PR is now judged by the current one.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check review-thread state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          set -euo pipefail
          # shellcheck source=ai_clients/claude/hooks/lib/review_thread_gate.sh
          source ai_clients/claude/hooks/lib/review_thread_gate.sh

          # ⚠️ Publish the verdict onto the PR HEAD explicitly — this job's OWN
          # check-run does not land there. For issue_comment (and
          # pull_request_review) GitHub runs the workflow in the DEFAULT
          # BRANCH's context, so Actions attaches the check-run to master's
          # SHA. Measured 2026-09-23 (dotfiles-dev#481): every issue_comment
          # run reported head_sha 5491893e = master, the required context was
          # absent from all 22 open PR heads, and every one read BLOCKED —
          # including two carrying three submitted reviews each, with
          # required_approving_review_count at 0.
          # ⚠️ EVERY exit path reports, including the selective skip below: a
          # required context has no "not applicable" state, and a PR with no
          # check-run at all is blocked exactly as hard as a failing one.
          # ⚠️ The job exits non-zero ONLY when it cannot publish, never to
          # mirror a failing verdict. An unpublished verdict leaves the PR
          # blocked, which is fail-closed; a wrongly published one is not.
          # OWNER/REPO come from the env: block, which shellcheck cannot see when it lints
          # this run: script standalone — same SC2153 exemption the selective-policy call
          # below already carries, needed here too now that this is their first use.
          # shellcheck disable=SC2153
          HEAD_SHA="$(gh api "repos/$OWNER/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')"
          report() {
            local conclusion="$1" title="$2" summary="${3:-}"
            if ! jq -n --arg s "$HEAD_SHA" --arg c "$conclusion" \
                       --arg t "$title" --arg b "$summary" \
                  '{name:"Review threads answered", head_sha:$s,
                    status:"completed", conclusion:$c,
                    output:{title:$t, summary:$b}}' \
                 | gh api -X POST "repos/$OWNER/$REPO/check-runs" \
                     --input - >/dev/null; then
              echo "::error::could not publish the check-run to $HEAD_SHA"
              exit 1
            fi
            echo "$conclusion: $title"
            exit 0
          }

          # CodeRabbit's own completion marker is a positive signal only —
          # see the header comment for why this never becomes an early exit.
          reviewer_reported=0
          if [ "$EVENT_NAME" = "issue_comment" ] \
            && [ "$COMMENT_AUTHOR" = "coderabbitai[bot]" ] \
            && printf '%s' "$COMMENT_BODY" | grep -qi 'full review finished'; then
            reviewer_reported=1
          fi

          # The reviewer ladder (#444/#446/#449) posts its fallback review as
          # an issue_comment from the OPERATOR'S OWN account — never a review
          # object, so review_count can't see it either (dotfiles-dev#451).
          # The attribution marker is PUBLIC TEXT anyone could paste into a
          # comment, so it is a positive signal only paired with the ONE
          # unforgeable part: author_association (same CWE-345 lesson #446's
          # review thread taught the ladder itself — never key on login).
          if [ "$reviewer_reported" -eq 0 ] && [ "$EVENT_NAME" = "issue_comment" ]; then
            # Parameter expansion, never `printf | head -n1`: with
            # `set -euo pipefail`, head exits after the first line and printf
            # takes SIGPIPE, so the assignment returns 141 and the step dies
            # before the marker check ever runs. Measured: rc=0 at 2 KB, rc=141
            # from ~50 KB up — and GitHub accepts comment bodies to 65536
            # chars, so a verbose fallback review reaches it. The verdict must
            # not depend on how much the reviewer had to say.
            first_line=${COMMENT_BODY%%$'\n'*}
            ladder_marker_re='^Fallback review — runtime: (qwen|codex), model: .+ \(selected by: .+\)$'
            if [[ "$first_line" =~ $ladder_marker_re ]] \
              && [[ "$COMMENT_AUTHOR_ASSOCIATION" =~ ^(OWNER|MEMBER|COLLABORATOR)$ ]]; then
              reviewer_reported=1
            fi
          fi

          # Selective, not full-parity (dotfiles-dev#157): none of the three
          # trigger events above carry a `paths:` filter, so the scope
          # decision is re-checked here at runtime instead. OWNER and REPO
          # come from the env: block above, which actionlint cannot see when
          # it lints this run: script standalone — hence SC2153.
          # ⚠️ dotfiles-dev#502: this pattern MUST select exactly the same
          # paths as coderabbit_trigger.yml's `paths:` filter
          # (ai_clients/claude/hooks/** and ai_clients/claude/settings.json
          # only) — a bare `(^|/)settings\.json$` matched ANY settings.json
          # in the repo (e.g. .vscode/settings.json), so a PR could be
          # REQUIRED to pass this gate while the trigger that would produce
          # the review it demands never fires (measured on #493: asks=0 for
          # 8h05m). tests/review_threads_trigger.bats asserts the two stay
          # in lockstep.
          # shellcheck disable=SC2153
          changed=$(gh pr view "$PR_NUMBER" --repo "$OWNER/$REPO" \
            --json files --jq '.files[].path')
          if ! printf '%s\n' "$changed" | grep -qE '^ai_clients/claude/hooks/|^ai_clients/claude/settings\.json$'; then
            report success "gate not required (selective policy)" \
              "No ai_clients/claude/hooks/ or ai_clients/claude/settings.json changes in this PR."
          fi

          # No review at all is a distinct failure from "thread left open" —
          # the shared gate reports "clean" on zero threads, which is correct
          # for its own soft-nudge callers but wrong for a required check.
          # A clean CodeRabbit review also submits zero review objects
          # (dotfiles-dev#431), so `review_count` alone can no longer tell
          # "reviewed, found nothing" apart from "never reviewed" — the
          # verified issue_comment marker above is what makes that call now.
          review_count=$(gh pr view "$PR_NUMBER" --repo "$OWNER/$REPO" \
            --json reviews --jq '.reviews | length')
          [ "$review_count" -gt 0 ] && reviewer_reported=1

          # ⚠️ Resolve the completion marker from the PR's HISTORY, not only
          # from the comment that fired THIS run. A clean review submits no
          # review object, so review_count stays 0 and the marker is a one-off
          # comment — any later ordinary comment would re-run this job with
          # reviewer_reported=0 and publish `failure` over the passing verdict
          # already on this head. Latent before this PR (the verdict landed on
          # master and changed nothing); a live regression the moment the
          # publish became authoritative.
          # Scoped to the current head push: a push MUST invalidate an earlier
          # clean verdict, which is why the marker is re-resolved per run
          # rather than cached.
          if [ "$reviewer_reported" -eq 0 ]; then
            # ⚠️ Server-assigned arrival time, NEVER the commit's own
            # committedDate. A commit carries whatever date its author chose,
            # so a backdated push would make the head look OLDER than an
            # existing clean-review marker and let that stale marker validate
            # new code (CWE-367). The earliest check-suite for the head SHA is
            # stamped by GitHub and cannot be authored. Measured on #455:
            # committedDate 16:53:54Z vs earliest check-suite 16:53:55Z.
            # Fails closed — no check suite means no trusted clock, so no
            # marker credit, rather than falling back to the forgeable one.
            head_seen_at="$(gh api "repos/$OWNER/$REPO/commits/$HEAD_SHA/check-suites" \
              --jq '[.check_suites[].created_at] | min // empty' 2>/dev/null || true)"
            if [ -n "$head_seen_at" ]; then
              # ⚠️ Identity from REST, never from the GraphQL comment shape.
              # `gh pr view --json comments` reports author.login as
              # "coderabbitai" with NO type field at all, so the old substring
              # test matched ANY login containing "coderabbit" and could not
              # tell a Bot from a User (CWE-345) — a forgeable reviewer report
              # on a deny-by-default gate. REST carries the exact login and
              # the account type; both are required.
              marker_count="$(gh api --paginate \
                "repos/$OWNER/$REPO/issues/$PR_NUMBER/comments" --jq '.' |
                jq -s --arg since "$head_seen_at" 'add // [] | [
                  .[]
                  | select(.user.login == "coderabbitai[bot]")
                  | select(.user.type == "Bot")
                  | select(.created_at > $since)
                  | select((.body // "") | ascii_downcase | test("full review finished"))
                ] | length')"
              if [ "${marker_count:-0}" -gt 0 ]; then
                reviewer_reported=1
              fi
            fi
          fi

          if [ "$reviewer_reported" -eq 0 ]; then
            report failure "no reviewer has reported on this PR yet" \
              "No submitted review, and no verified reviewer completion marker."
          fi

          gate_pr_thread_state "$OWNER" "$REPO" "$PR_NUMBER" ".review-bots.yaml"
          echo "$GATE_DETAIL"
          # `unreviewed` is the ONE gate status this step must not act on. Reaching this line
          # means reviewer_reported=1 -- the check above exits otherwise -- and this step
          # established that from signals the gate cannot see: the triggering event payload,
          # this PR's own published check-run history, and `pr view --json reviews`. The gate
          # sees only the GraphQL page, so its `unreviewed` here is the poorer of two verdicts
          # about the identical question, and letting it win republishes `failure` over a PR a
          # reviewer demonstrably reported on. Every other non-clean status (problems, running,
          # unreadable) answers a DIFFERENT question and still blocks.
          if [ "$GATE_STATUS" != "clean" ] && [ "$GATE_STATUS" != "unreviewed" ]; then
            report failure "review gate status=$GATE_STATUS" "$GATE_DETAIL"
          fi
          report success "review threads answered" "$GATE_DETAIL"
